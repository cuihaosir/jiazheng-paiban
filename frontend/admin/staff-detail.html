<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿姨档案 - 家政排班管理后台</title>
<link rel="stylesheet" href="styles/admin.css">
<style>
  .hero { display: flex; align-items: center; gap: 18px; padding: 22px; }
  .hero-avatar { font-size: 52px; }
  .hero-name { font-size: 23px; font-weight: 700; }
  .hero-meta { font-size: 13px; color: var(--text-tertiary); margin-top: 3px; }
  .hero-spacer { flex: 1; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-radius: 0 0 var(--radius-lg) var(--radius-lg); overflow: hidden; }
  .stat-cell { background: #fff; padding: 15px 18px; }
  .stat-val { font-size: 21px; font-weight: 700; }
  .stat-key { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
</style>
</head>
<body>
<div class="main">
  <header class="topbar">
    <div>
      <span class="topbar-title">阿姨档案</span>
      <span class="topbar-sub" id="nameLabel"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="history.back()">‹ 返回</button>
      <span id="topActions"></span>
    </div>
  </header>
  <div class="page" id="page"></div>
</div>

<script src="../shared/scripts/utils.js"></script>
<script src="../shared/scripts/mock-data.js"></script>
<script src="../shared/scripts/storage.js"></script>
<script src="scripts/layout.js"></script>
<script>
if (AdminLayout.init('staff')) {

  const id = Utils.getParam('id');
  const s = StaffStorage.getById(id);

  if (!s) {
    document.getElementById('page').innerHTML =
      '<div class="card"><div class="table-empty"><div class="table-empty-icon">🔍</div>阿姨不存在</div></div>';
  } else {
    document.getElementById('nameLabel').textContent = s.name;
    document.getElementById('topActions').innerHTML =
      `<button class="btn btn-primary" onclick="location.href='order-create.html?staffId=${s.id}'">+ 给她派单</button>`;

    const all = OrderStorage.getByStaff(id);
    const done = all.filter(o => o.status === 4);
    const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
    const monthDone = done.filter(o => new Date(o.startTime) >= monthStart);
    const totalHours = done.reduce((a, o) => a + (o.duration || 0), 0);
    const totalRevenue = done.reduce((a, o) => a + o.amount, 0);
    const cancelled = all.filter(o => o.status === 0).length;
    const stName = s.status === 1 ? '在岗' : s.status === 2 ? '请假中' : '已离职';
    const dotCls = s.status === 1 ? 'dot-on' : s.status === 2 ? 'dot-leave' : 'dot-off';

    // 工资规则说明
    const cfg = s.salaryConfig || {};
    let salDesc = '';
    if (s.salaryType === 1) {
      salDesc = Object.entries(cfg.perOrder || {}).map(([k, v]) => `${k} ${v} 元/单`).join('、') || '未配置';
    } else if (s.salaryType === 2) salDesc = `${cfg.hourlyRate || 0} 元/小时`;
    else if (s.salaryType === 3) salDesc = `底薪 ${cfg.baseSalary || 0} 元 + 提成 ${((cfg.commissionRate || 0) * 100).toFixed(0)}%`;
    else salDesc = `${cfg.monthlyPay || 0} 元/月`;

    // 本月工资
    const sal = SalaryStorage.getByStaff(id, Utils.getCurrentMonth()) || SalaryStorage.calculateSalary(id, Utils.getCurrentMonth());

    // 近期排班
    const upcoming = all.filter(o => o.status !== 0 && new Date(o.startTime) >= new Date())
      .sort((a, b) => new Date(a.startTime) - new Date(b.startTime)).slice(0, 8);
    const history = all.filter(o => new Date(o.startTime) < new Date())
      .sort((a, b) => new Date(b.startTime) - new Date(a.startTime)).slice(0, 12);

    document.getElementById('page').innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="hero">
          <span class="hero-avatar">${s.avatar}</span>
          <div>
            <div class="hero-name">${s.name}</div>
            <div class="hero-meta">${s.phone} · 入职 ${s.entryDate || '-'} · <span class="dot ${dotCls}"></span>${stName}</div>
            <div style="margin-top:8px">
              ${s.skills.map(k => `<span class="tag tag-skill">${k}</span>`).join(' ')}
              ${s.serviceAreas.map(a => `<span class="tag tag-area">${a}</span>`).join(' ')}
            </div>
          </div>
          <div class="hero-spacer"></div>
          <div style="text-align:right">
            <div style="font-size:27px;font-weight:700;color:var(--warning)">⭐ ${s.rating}</div>
            <div class="hero-meta">客户平均评分</div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="stat-cell"><div class="stat-val">${done.length}</div><div class="stat-key">累计完成订单</div></div>
          <div class="stat-cell"><div class="stat-val">${monthDone.length}</div><div class="stat-key">本月完成</div></div>
          <div class="stat-cell"><div class="stat-val">${totalHours} h</div><div class="stat-key">累计服务时长</div></div>
          <div class="stat-cell"><div class="stat-val" style="color:var(--primary)">${Utils.formatMoney(totalRevenue)}</div><div class="stat-key">累计创造营收</div></div>
        </div>
      </div>

      <div class="grid-side">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card">
            <div class="card-head"><span class="card-title">未来排班（${upcoming.length}）</span>
              <a class="btn btn-ghost btn-sm" href="schedule.html">排班日历 →</a></div>
            <div class="card-body tight">
              ${upcoming.length === 0
                ? '<div class="table-empty" style="padding:34px">近期没有排班</div>'
                : `<table class="data"><thead><tr><th>日期</th><th>时间</th><th>客户</th><th>服务</th><th>地址</th><th>金额</th><th>状态</th></tr></thead>
                   <tbody>${upcoming.map(o => `<tr class="clickable" onclick="location.href='order-detail.html?id=${o.id}'">
                     <td class="td-strong">${Utils.formatDate(o.startTime, 'MM-DD')} ${Utils.getWeekDay(o.startTime)}</td>
                     <td>${Utils.formatDate(o.startTime, 'HH:mm')}–${Utils.formatDate(o.endTime, 'HH:mm')}</td>
                     <td>${o.customerName}</td><td>${o.serviceType}</td>
                     <td class="td-muted">${o.address.length > 14 ? o.address.slice(0, 14) + '…' : o.address}</td>
                     <td class="td-money">${Utils.formatMoney(o.amount)}</td>
                     <td><span class="tag tag-${Utils.getOrderStatusClass(o.status)}">${Utils.getOrderStatusName(o.status)}</span></td>
                   </tr>`).join('')}</tbody></table>`}
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="card-title">历史服务记录</span></div>
            <div class="card-body tight">
              ${history.length === 0
                ? '<div class="table-empty" style="padding:34px">暂无历史记录</div>'
                : `<table class="data"><thead><tr><th>日期</th><th>客户</th><th>服务</th><th>时长</th><th>金额</th><th>状态</th></tr></thead>
                   <tbody>${history.map(o => `<tr class="clickable" onclick="location.href='order-detail.html?id=${o.id}'">
                     <td>${Utils.formatDate(o.startTime, 'YYYY-MM-DD')}</td>
                     <td>${o.customerName}</td><td>${o.serviceType}</td>
                     <td class="td-muted">${o.duration} h</td>
                     <td class="td-money">${Utils.formatMoney(o.amount)}</td>
                     <td><span class="tag tag-${Utils.getOrderStatusClass(o.status)}">${Utils.getOrderStatusName(o.status)}</span></td>
                   </tr>`).join('')}</tbody></table>`}
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card">
            <div class="card-head"><span class="card-title">工资规则</span></div>
            <div class="card-body">
              <dl class="dl" style="grid-template-columns:76px 1fr">
                <dt>结算方式</dt><dd>${Utils.getSalaryTypeName(s.salaryType)}</dd>
                <dt>单价配置</dt><dd>${salDesc}</dd>
              </dl>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="card-title">本月工资预估</span>
              <a class="btn btn-ghost btn-sm" href="salary.html">工资结算 →</a></div>
            <div class="card-body">
              ${sal && sal.orderCount > 0 ? `
                <div style="font-size:29px;font-weight:700;color:var(--primary);letter-spacing:-.5px">${Utils.formatMoney(sal.shouldPay)}</div>
                <div class="td-muted" style="margin-bottom:13px">${sal.orderCount} 单 · ${sal.totalHours} 小时</div>
                <dl class="dl" style="grid-template-columns:70px 1fr;font-size:13px">
                  <dt>基本工资</dt><dd>${Utils.formatMoney(sal.baseSalary)}</dd>
                  ${sal.commission > 0 ? `<dt>提成</dt><dd>${Utils.formatMoney(sal.commission)}</dd>` : ''}
                  ${sal.bonus > 0 ? `<dt>奖金</dt><dd>${Utils.formatMoney(sal.bonus)}</dd>` : ''}
                  ${sal.subsidy > 0 ? `<dt>补贴</dt><dd>${Utils.formatMoney(sal.subsidy)}</dd>` : ''}
                </dl>`
                : '<div class="td-muted" style="padding:14px 0;text-align:center">本月暂无完成订单</div>'}
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="card-title">服务质量</span></div>
            <div class="card-body">
              <dl class="dl" style="grid-template-columns:88px 1fr">
                <dt>平均评分</dt><dd>⭐ ${s.rating}</dd>
                <dt>完成率</dt><dd>${all.length ? Math.round(done.length / all.length * 100) : 0}%</dd>
                <dt>取消订单</dt><dd>${cancelled} 单</dd>
                <dt>备注</dt><dd>${s.remark || '<span class="td-muted">无</span>'}</dd>
              </dl>
            </div>
          </div>
        </div>
      </div>`;
  }
}
</script>
</body>
</html>
