<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单详情 - 家政排班管理后台</title>
<link rel="stylesheet" href="styles/admin.css">
<style>
  .hero { display: flex; align-items: center; gap: 18px; padding: 20px 22px; }
  .hero-amount { font-size: 32px; font-weight: 700; color: var(--primary); letter-spacing: -.5px; }
  .hero-sep { width: 1px; height: 46px; background: var(--border); }
  .hero-type { font-size: 18px; font-weight: 600; }
  .hero-meta { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }
  .hero-spacer { flex: 1; }

  /* 一键拨号 */
  .call {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 13px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; font-size: 13.5px; color: var(--text-primary);
    text-decoration: none; transition: all .15s; white-space: nowrap;
  }
  .call:hover { border-color: var(--success); color: var(--success); background: #f0fdf4; }
  .call-num { font-family: ui-monospace, Consolas, monospace; letter-spacing: .3px; }

  /* 金额口径拆分 */
  .money-split { display: flex; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .money-cell { flex: 1; background: #fff; padding: 13px 15px; }
  .money-cell.mine { background: #f0fdf4; }
  .money-k { font-size: 12.5px; color: var(--text-tertiary); }
  .money-v { font-size: 21px; font-weight: 700; margin-top: 2px; }
  .money-cell.mine .money-v { color: var(--success); }
  .money-note { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; line-height: 1.5; }

  .gps { display: flex; gap: 9px; padding: 11px 13px; border-radius: 9px; font-size: 13px; line-height: 1.6; }
  .gps-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
  .gps-no { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .gps-c { font-family: ui-monospace, Consolas, monospace; }

  .stars-big { font-size: 19px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="main">
  <header class="topbar">
    <div>
      <span class="topbar-title">订单详情</span>
      <span class="topbar-sub" id="orderNoLabel"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="history.back()">‹ 返回</button>
      <span id="topActions"></span>
    </div>
  </header>

  <div class="page" id="page"></div>
</div>

<div id="modalHost"></div>

<script src="../shared/scripts/utils.js"></script>
<script src="../shared/scripts/mock-data.js"></script>
<script src="../shared/scripts/storage.js"></script>
<script src="scripts/layout.js"></script>
<script>
if (AdminLayout.init('orders')) {

  const id = Utils.getParam('id');
  let order = OrderStorage.getById(id);

  if (!order) {
    document.getElementById('page').innerHTML =
      '<div class="card"><div class="table-empty"><div class="table-empty-icon">🔍</div>订单不存在或已被删除</div></div>';
  } else {
    render();
  }

  function render() {
    order = OrderStorage.getById(id);
    const cust = CustomerStorage.getById(order.customerId);
    const staff = StaffStorage.getById(order.staffId);
    document.getElementById('orderNoLabel').textContent = order.orderNo;

    // 顶部操作按钮
    let acts = '';
    if (order.status === 1) {
      acts = `<button class="btn btn-success" onclick="setStatus(2)">确认接单</button>
              <button class="btn btn-ghost" onclick="openReschedule()">改期</button>
              <button class="btn btn-danger" onclick="openCancel()">取消订单</button>`;
    } else if (order.status === 2) {
      acts = `<button class="btn btn-primary" onclick="setStatus(3)">标记已上门</button>
              <button class="btn btn-ghost" onclick="openReschedule()">改期</button>
              <button class="btn btn-danger" onclick="openCancel()">取消订单</button>`;
    } else if (order.status === 3) {
      acts = `<button class="btn btn-success" onclick="setStatus(4)">标记已完成</button>`;
    } else if (order.status === 4) {
      acts = `<button class="btn btn-primary" onclick="sendReview()">📩 ${order.reviewInvitedAt ? '重发' : '发送'}评价邀请</button>`;
    }
    document.getElementById('topActions').innerHTML = acts;

    // 阿姨应得（与月度工资算法同源）
    const mp = SalaryStorage.orderPay(staff, order);

    // 时间线
    const tl = [{ t: order.createdAt, text: '订单创建', color: '#94a3b8' }];
    if (order.status >= 2) tl.push({ t: order.createdAt, text: `${order.staffName} 确认接单`, color: '#3b82f6' });
    if (order.status >= 3) {
      let at = '阿姨已上门，开始服务';
      if (order.arriveLat && order.arriveLng) at += '（已 GPS 打卡）';
      else if (order.arriveGpsErr) at += '（打卡未获取到位置）';
      tl.push({ t: order.arriveAt || order.startTime, text: at, color: '#8b5cf6' });
    }
    if (order.status >= 4) tl.push({ t: order.finishAt || order.endTime, text: '服务完成', color: '#10b981' });
    if (order.reviewInvitedAt) tl.push({ t: order.reviewInvitedAt, text: '已向客户发送评价邀请短信（模拟）', color: '#0891b2' });
    if (order.rating > 0) tl.push({ t: order.reviewedAt || order.endTime, text: `客户评价 ${order.rating} 星${order.review ? '：' + order.review : ''}`, color: '#f59e0b' });
    if (order.status === 0) tl.push({ t: order.createdAt, text: '订单已取消：' + (order.cancelReason || '未填写原因'), color: '#ef4444' });

    // GPS 打卡凭证
    let gpsHtml = '';
    if (order.arriveAt) {
      if (order.arriveLat && order.arriveLng) {
        const lat = Number(order.arriveLat).toFixed(6), lng = Number(order.arriveLng).toFixed(6);
        gpsHtml = `<div class="gps gps-ok" style="margin-top:12px">
          <span>📍</span>
          <div><b>GPS 打卡成功</b> · ${Utils.formatDate(order.arriveAt, 'MM-DD HH:mm')}<br>
          坐标 <span class="gps-c">${lat}, ${lng}</span>${order.arriveAcc ? '，精度约 ' + Math.round(order.arriveAcc) + ' 米' : ''}<br>
          <a href="https://uri.amap.com/marker?position=${lng},${lat}&name=打卡位置" target="_blank" rel="noopener"
             style="color:#15803d;font-weight:600">在高德地图查看 ↗</a></div>
        </div>`;
      } else {
        gpsHtml = `<div class="gps gps-no" style="margin-top:12px">
          <span>⚠️</span>
          <div><b>已打卡，但未获取到位置</b> · ${Utils.formatDate(order.arriveAt, 'MM-DD HH:mm')}<br>
          原因：${order.arriveGpsErr || '未知'}。打卡本身有效，仅缺少位置凭证。</div>
        </div>`;
      }
    }

    // 同阿姨当天其他订单
    const dayStart = order.startTime.slice(0, 10);
    const sameDay = OrderStorage.getByStaff(order.staffId)
      .filter(o => o.id !== order.id && o.status !== 0 && o.startTime.slice(0, 10) === dayStart)
      .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

    document.getElementById('page').innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="hero">
          <div>
            <div class="hero-amount">${Utils.formatMoney(order.amount)}</div>
            <div class="hero-meta">订单金额</div>
          </div>
          <div class="hero-sep"></div>
          <div>
            <div class="hero-type">${order.serviceType}</div>
            <div class="hero-meta">${Utils.formatDate(order.startTime, 'YYYY-MM-DD')} ${Utils.getWeekDay(order.startTime)}
              ${Utils.formatDate(order.startTime, 'HH:mm')}–${Utils.formatDate(order.endTime, 'HH:mm')} · ${order.duration} 小时</div>
          </div>
          <div class="hero-spacer"></div>
          <span class="tag tag-${Utils.getOrderStatusClass(order.status)}" style="font-size:14px;padding:6px 16px">
            ${Utils.getOrderStatusName(order.status)}</span>
        </div>
      </div>

      <div class="grid-side">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card">
            <div class="card-head"><span class="card-title">金额构成</span></div>
            <div class="card-body">
              <div class="money-split">
                <div class="money-cell">
                  <div class="money-k">订单金额（客户付款）</div>
                  <div class="money-v">${Utils.formatMoney(order.amount)}</div>
                  <div class="money-note">客户支付给公司的服务费</div>
                </div>
                <div class="money-cell mine">
                  <div class="money-k">阿姨应得</div>
                  <div class="money-v">${mp.perOrderBased ? Utils.formatMoney(mp.pay) : '不按单计酬'}</div>
                  <div class="money-note">${mp.note}</div>
                </div>
                <div class="money-cell">
                  <div class="money-k">公司毛利</div>
                  <div class="money-v">${mp.perOrderBased ? Utils.formatMoney(Math.round((order.amount - mp.pay) * 100) / 100) : '—'}</div>
                  <div class="money-note">${mp.perOrderBased
                    ? '毛利率 ' + (order.amount > 0 ? Math.round((order.amount - mp.pay) / order.amount * 100) : 0) + '%'
                    : '包月阿姨成本按月摊销'}</div>
                </div>
              </div>
              <div class="field-hint" style="margin-top:10px">
                阿姨端只展示「阿姨应得」，与此处数字同源，避免工资口径误解。
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="card-title">订单信息</span></div>
            <div class="card-body">
              <dl class="dl">
                <dt>订单号</dt><dd>${order.orderNo}</dd>
                <dt>服务类型</dt><dd>${order.serviceType}</dd>
                <dt>服务时间</dt><dd>${Utils.formatDate(order.startTime, 'YYYY-MM-DD HH:mm')} – ${Utils.formatDate(order.endTime, 'HH:mm')}（${order.duration} 小时）</dd>
                <dt>服务地址</dt><dd>${order.address}</dd>
                <dt>订单来源</dt><dd>${order.source || '-'}${order.channelOrderNo ? ' <span class="tag tag-soft">' + order.channelOrderNo + '</span>' : ''}</dd>
                <dt>创建时间</dt><dd>${Utils.formatDate(order.createdAt, 'YYYY-MM-DD HH:mm')}</dd>
                <dt>客户备注</dt><dd>${order.remark || '<span class="td-muted">无</span>'}</dd>
                ${order.rating > 0 ? `<dt>客户评价</dt><dd><span class="stars-big">${'⭐'.repeat(order.rating)}</span> ${order.rating} 星
                  ${(order.reviewTags || []).map(t => `<span class="tag tag-soft">${t}</span>`).join(' ')}
                  ${order.review ? '<br><span style="color:var(--text-secondary)">「' + order.review + '」</span>' : ''}</dd>` : ''}
                ${order.cancelReason ? `<dt>取消原因</dt><dd style="color:var(--danger)">${order.cancelReason}</dd>` : ''}
              </dl>
              ${gpsHtml}
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-head">
                <span class="card-title">客户</span>
                ${cust ? `<a class="btn btn-ghost btn-sm" href="customer-detail.html?id=${cust.id}">客户档案 →</a>` : ''}
              </div>
              <div class="card-body">
                <div style="font-size:16px;font-weight:600">${order.customerName}</div>
                <div style="margin:6px 0 12px">
                  <a class="call" href="tel:${order.customerPhone}" title="点击拨号">
                    📞 <span class="call-num">${order.customerPhone}</span>
                  </a>
                  <button class="btn btn-ghost btn-sm" style="margin-left:6px"
                    onclick="copyText('${order.customerPhone}')">复制</button>
                </div>
                ${cust ? `<dl class="dl" style="grid-template-columns:80px 1fr">
                  <dt>等级</dt><dd><span class="tag ${cust.level === 3 ? 'tag-svip' : cust.level === 2 ? 'tag-vip' : 'tag-soft'}">${cust.level === 3 ? 'SVIP' : cust.level === 2 ? 'VIP' : '普通'}</span></dd>
                  <dt>累计</dt><dd>${cust.totalOrders} 单 / ${Utils.formatMoney(cust.totalAmount)}</dd>
                  <dt>储值余额</dt><dd>${Number(cust.balance || 0) > 0
                    ? '<b style="color:var(--success)">' + Utils.formatMoney(cust.balance) + '</b>'
                    : '<span class="td-muted">无</span>'}</dd>
                  <dt>偏好</dt><dd>${(cust.tags || []).map(t => `<span class="tag tag-soft">${t}</span>`).join(' ') || '<span class="td-muted">无</span>'}</dd>
                </dl>` : ''}
              </div>
            </div>

            <div class="card">
              <div class="card-head">
                <span class="card-title">服务阿姨</span>
                ${staff ? `<a class="btn btn-ghost btn-sm" href="staff-detail.html?id=${staff.id}">阿姨档案 →</a>` : ''}
              </div>
              <div class="card-body">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                  <span style="font-size:30px">${staff ? staff.avatar : '👩'}</span>
                  <div>
                    <div style="font-size:16px;font-weight:600">${order.staffName}</div>
                    <div class="td-muted">${staff ? '⭐ ' + staff.rating + ' · ' + Utils.getSalaryTypeName(staff.salaryType) : ''}</div>
                  </div>
                </div>
                ${staff ? `<div style="margin-bottom:12px">
                  <a class="call" href="tel:${staff.phone}" title="点击拨号">
                    📞 <span class="call-num">${staff.phone}</span>
                  </a>
                  <button class="btn btn-ghost btn-sm" style="margin-left:6px"
                    onclick="copyText('${staff.phone}')">复制</button>
                </div>
                <div>${staff.skills.map(s => `<span class="tag tag-skill">${s}</span>`).join(' ')}</div>` : ''}
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="card-title">该阿姨当天其他排班</span></div>
            <div class="card-body tight">
              ${sameDay.length === 0
                ? '<div class="table-empty" style="padding:30px">当天没有其他订单</div>'
                : `<table class="data"><thead><tr><th>时间</th><th>客户</th><th>服务</th><th>金额</th><th>状态</th></tr></thead>
                   <tbody>${sameDay.map(o => `<tr class="clickable" onclick="location.href='order-detail.html?id=${o.id}'">
                     <td class="td-strong">${Utils.formatDate(o.startTime, 'HH:mm')}–${Utils.formatDate(o.endTime, 'HH:mm')}</td>
                     <td>${o.customerName}</td><td>${o.serviceType}</td>
                     <td class="td-money">${Utils.formatMoney(o.amount)}</td>
                     <td><span class="tag tag-${Utils.getOrderStatusClass(o.status)}">${Utils.getOrderStatusName(o.status)}</span></td>
                   </tr>`).join('')}</tbody></table>`}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span class="card-title">订单进度</span></div>
          <div class="card-body">
            <div class="tl">
              ${tl.map(x => `<div class="tl-item">
                <div class="tl-dot" style="background:${x.color}"></div>
                <div class="tl-time">${Utils.formatDate(x.t, 'MM-DD HH:mm')}</div>
                <div class="tl-text">${x.text}</div>
              </div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
  }

  window.setStatus = function (s) {
    const patch = { status: s };
    if (s === 3) patch.arriveAt = new Date().toISOString();
    if (s === 4) patch.finishAt = new Date().toISOString();
    OrderStorage.update(id, patch);

    const o = OrderStorage.getById(id);
    if (s === 2) {
      NotifyStorage.push('order_confirmed', o.staffName, '',
        `【家政管家】您有新订单：${Utils.formatDate(o.startTime, 'MM-DD HH:mm')} ${o.address}（${o.serviceType}）`, id);
    }
    Utils.toast('订单状态已更新');
    render();

    // 完成后自动邀请评价
    if (s === 4) setTimeout(() => sendReview(true), 300);
  };

  /** 复制文本到剪贴板 */
  window.copyText = function (t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(
        () => Utils.toast('已复制：' + t),
        () => Utils.toast('复制失败，请手动选择')
      );
    } else {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); Utils.toast('已复制：' + t); }
      catch (e) { Utils.toast('复制失败'); }
      document.body.removeChild(ta);
    }
  };

  /** 发送评价邀请（短信为模拟，链接真实可用） */
  window.sendReview = function (silent) {
    const o = OrderStorage.getById(id);
    if (o.status < 4) { Utils.toast('订单完成后才能邀请评价'); return; }

    const link = location.origin +
      location.pathname.replace(/admin\/order-detail\.html$/, 'review.html') +
      '?order=' + id;
    const sms = `【家政管家】您的${o.serviceType}服务已完成，感谢信任！请为${o.staffName}的服务打个分：${link}`;

    OrderStorage.update(id, { reviewInvitedAt: new Date().toISOString() });
    NotifyStorage.push('review_invite', o.customerName, o.customerPhone, sms, id);

    if (silent) { render(); return; }

    document.getElementById('modalHost').innerHTML = `
      <div class="mask" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-head">
            <span class="modal-title">评价邀请已生成</span>
            <button class="modal-x" onclick="closeModal()">×</button>
          </div>
          <div class="modal-body">
            <div class="alert alert-warn"><span>⚠️</span><div>
              <b>演示环境：短信未真实发出。</b><br>
              真实发送需后端对接短信服务商（阿里云短信 / 腾讯云 SMS），
              并完成企业实名认证与短信模板报备，约 0.045 元/条。
            </div></div>

            <div class="field">
              <label class="field-label">将发送给 ${o.customerName}（${o.customerPhone}）</label>
              <textarea class="textarea" readonly style="min-height:92px">${sms}</textarea>
            </div>

            <div class="field" style="margin-bottom:0">
              <label class="field-label">评价链接（可直接复制发给客户）</label>
              <input class="input" id="revLink" readonly value="${link}">
              <div class="field-hint">链接是真实可用的，点下方按钮可自己先体验客户端评价页面。</div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
            <button class="btn btn-ghost" onclick="copyText(document.getElementById('revLink').value)">复制链接</button>
            <button class="btn btn-primary" onclick="window.open(document.getElementById('revLink').value,'_blank')">预览评价页</button>
          </div>
        </div>
      </div>`;
    render();
  };

  // ===== 取消弹窗 =====
  window.openCancel = function () {
    document.getElementById('modalHost').innerHTML = `
      <div class="mask" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-head">
            <span class="modal-title">取消订单</span>
            <button class="modal-x" onclick="closeModal()">×</button>
          </div>
          <div class="modal-body">
            <div class="alert alert-warn"><span>⚠️</span><div>取消后该阿姨的排班将被释放，可接其他订单。</div></div>
            <div class="field">
              <label class="field-label">取消原因 <span class="req">*</span></label>
              <select class="select" id="cancelType">
                <option>客户原因 - 临时有事</option>
                <option>客户原因 - 改约其他时间</option>
                <option>客户原因 - 不需要了</option>
                <option>阿姨原因 - 身体不适</option>
                <option>阿姨原因 - 时间冲突</option>
                <option>公司原因 - 人员调配</option>
                <option>其他</option>
              </select>
            </div>
            <div class="field" style="margin-bottom:0">
              <label class="field-label">补充说明</label>
              <textarea class="textarea" id="cancelNote" placeholder="选填"></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closeModal()">返回</button>
            <button class="btn btn-danger" onclick="doCancel()">确认取消订单</button>
          </div>
        </div>
      </div>`;
  };

  window.doCancel = function () {
    const type = document.getElementById('cancelType').value;
    const note = document.getElementById('cancelNote').value.trim();
    OrderStorage.update(id, { status: 0, cancelReason: type + (note ? '：' + note : '') });
    closeModal();
    Utils.toast('订单已取消');
    render();
  };

  // ===== 改期弹窗 =====
  window.openReschedule = function () {
    const o = OrderStorage.getById(id);
    document.getElementById('modalHost').innerHTML = `
      <div class="mask" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-head">
            <span class="modal-title">订单改期</span>
            <button class="modal-x" onclick="closeModal()">×</button>
          </div>
          <div class="modal-body">
            <div class="alert alert-info"><span>ℹ️</span><div>
              当前：${Utils.formatDate(o.startTime, 'YYYY-MM-DD HH:mm')} – ${Utils.formatDate(o.endTime, 'HH:mm')}<br>
              保存前会自动检测 ${o.staffName} 的新时段是否冲突。</div></div>
            <div class="field-row">
              <div class="field">
                <label class="field-label">新日期 <span class="req">*</span></label>
                <input class="input" id="rsDate" type="date" value="${Utils.formatDate(o.startTime)}" onchange="rsCheck()">
              </div>
              <div class="field">
                <label class="field-label">新开始时间 <span class="req">*</span></label>
                <input class="input" id="rsTime" type="time" value="${Utils.formatDate(o.startTime, 'HH:mm')}" onchange="rsCheck()">
              </div>
            </div>
            <div id="rsResult"></div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closeModal()">返回</button>
            <button class="btn btn-primary" onclick="doReschedule()">确认改期</button>
          </div>
        </div>
      </div>`;
    rsCheck();
  };

  function rsRange() {
    const o = OrderStorage.getById(id);
    const d = document.getElementById('rsDate').value;
    const t = document.getElementById('rsTime').value;
    if (!d || !t) return null;
    const start = new Date(d + 'T' + t + ':00');
    return { start: start.toISOString(), end: new Date(start.getTime() + o.duration * 3600000).toISOString() };
  }

  window.rsCheck = function () {
    const r = rsRange();
    const box = document.getElementById('rsResult');
    if (!r) { box.innerHTML = ''; return false; }
    const o = OrderStorage.getById(id);
    const hits = OrderStorage.checkConflict(o.staffId, r.start, r.end, id);
    if (hits.length) {
      box.innerHTML = `<div class="alert alert-err"><span>⚠️</span><div><b>新时段冲突</b><br>
        ${hits.map(h => `· ${Utils.formatDate(h.startTime, 'MM-DD HH:mm')}–${Utils.formatDate(h.endTime, 'HH:mm')} ${h.customerName}`).join('<br>')}</div></div>`;
      return false;
    }
    box.innerHTML = `<div class="alert alert-ok"><span>✅</span><div>新时段：${Utils.formatDate(r.start, 'MM-DD HH:mm')}–${Utils.formatDate(r.end, 'HH:mm')}，无冲突。</div></div>`;
    return true;
  };

  window.doReschedule = function () {
    if (!rsCheck()) { Utils.toast('新时段存在冲突，请重新选择'); return; }
    const r = rsRange();
    OrderStorage.update(id, { startTime: r.start, endTime: r.end });
    closeModal();
    Utils.toast('改期成功，已通知客户和阿姨');
    render();
  };

  window.closeModal = function () { document.getElementById('modalHost').innerHTML = ''; };
}
</script>
</body>
</html>
