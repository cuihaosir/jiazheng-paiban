<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 - 家政排班管理后台</title>
<link rel="stylesheet" href="styles/admin.css">
<style>
  .alert-list { display: flex; flex-direction: column; gap: 9px; }
  .alert-item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px; border-radius: 9px; font-size: 13.5px;
    border: 1px solid; cursor: pointer; transition: transform .12s;
  }
  .alert-item:hover { transform: translateX(2px); }
  .alert-item-icon { font-size: 17px; }
  .alert-item-body { flex: 1; }
  .alert-item-title { font-weight: 500; }
  .alert-item-desc { font-size: 12.5px; opacity: .85; margin-top: 1px; }
  .alert-item-go { font-size: 16px; opacity: .5; }
  .sev-warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .sev-err  { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .sev-info { background: var(--primary-bg); border-color: #bfdbfe; color: #1e40af; }
  .no-alert { text-align: center; padding: 30px; color: var(--text-tertiary); font-size: 13px; }
</style>
</head>
<body>
<div class="main">
  <header class="topbar">
    <div>
      <span class="topbar-title">工作台</span>
      <span class="topbar-sub" id="todayLabel"></span>
    </div>
    <div class="topbar-actions">
      <a class="btn btn-ghost" href="schedule.html">📅 查看排班</a>
      <a class="btn btn-primary" href="orders.html?action=create">+ 新建订单</a>
    </div>
  </header>

  <div class="page">
    <div class="kpi-row" id="kpiRow"></div>

    <div class="grid-side">
      <div class="card">
        <div class="card-head">
          <span class="card-title">今日订单安排</span>
          <a class="btn btn-ghost btn-sm" href="orders.html">全部订单 →</a>
        </div>
        <div class="card-body tight">
          <div class="table-wrap" id="todayTable"></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-head"><span class="card-title">待处理事项</span></div>
          <div class="card-body">
            <div class="alert-list" id="alertList"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span class="card-title">本周订单趋势</span></div>
          <div class="card-body">
            <div class="bars" id="weekBars"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../shared/scripts/utils.js"></script>
<script src="../shared/scripts/mock-data.js"></script>
<script src="../shared/scripts/storage.js"></script>
<script src="scripts/layout.js"></script>
<script>
  if (AdminLayout.init('dashboard')) {

    const now = new Date();
    document.getElementById('todayLabel').textContent =
      Utils.formatDate(now.toISOString(), 'YYYY年MM月DD日') + ' ' + Utils.getWeekDay(now.toISOString());

    // ===== KPI =====
    const stats = OrderStorage.getStats();
    const kpis = [
      { label: '今日订单', value: stats.todayCount, foot: `待确认 ${stats.todayPending} 单`, icon: '📋', bg: '#eff6ff' },
      { label: '本月营收', value: Utils.formatMoney(stats.monthRevenue), foot: `已完成 ${stats.monthCompleted} 单`, icon: '💰', bg: '#f0fdf4' },
      { label: '在岗阿姨', value: StaffStorage.getActiveCount(), foot: `共 ${StaffStorage.getAll().length} 人`, icon: '👩', bg: '#fef3c7' },
      { label: '订单取消率', value: stats.cancelRate + '%', foot: `本月 ${stats.monthOrders} 单`, icon: '📉', bg: '#fce7f3' }
    ];
    document.getElementById('kpiRow').innerHTML = kpis.map(k => `
      <div class="kpi">
        <div class="kpi-top">
          <span class="kpi-label">${k.label}</span>
          <span class="kpi-badge" style="background:${k.bg}">${k.icon}</span>
        </div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-foot">${k.foot}</div>
      </div>
    `).join('');

    // ===== 今日订单表 =====
    const todayOrders = OrderStorage.getTodayOrders()
      .filter(o => o.status !== 0)
      .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

    document.getElementById('todayTable').innerHTML = todayOrders.length === 0
      ? '<div class="table-empty"><div class="table-empty-icon">🌤️</div>今天暂无订单安排</div>'
      : `<table class="data">
          <thead><tr>
            <th style="width:112px">时间</th>
            <th>客户</th>
            <th>服务类型</th>
            <th>阿姨</th>
            <th>地址</th>
            <th style="width:88px">金额</th>
            <th style="width:82px">状态</th>
          </tr></thead>
          <tbody>${todayOrders.map(o => `
            <tr class="clickable" onclick="location.href='order-detail.html?id=${o.id}'">
              <td class="td-strong">${Utils.formatDate(o.startTime, 'HH:mm')}–${Utils.formatDate(o.endTime, 'HH:mm')}</td>
              <td>${o.customerName}<div class="td-muted">${o.customerPhone}</div></td>
              <td>${o.serviceType}<div class="td-muted">${o.duration} 小时</div></td>
              <td>${o.staffName}</td>
              <td class="td-muted">${o.address.length > 18 ? o.address.slice(0, 18) + '…' : o.address}</td>
              <td class="td-money">${Utils.formatMoney(o.amount)}</td>
              <td><span class="tag tag-${Utils.getOrderStatusClass(o.status)}">${Utils.getOrderStatusName(o.status)}</span></td>
            </tr>`).join('')}
          </tbody></table>`;

    // ===== 待处理事项 =====
    const alerts = [];
    const pending = OrderStorage.getAll().filter(o => o.status === 1);
    if (pending.length) {
      alerts.push({ sev: 'warn', icon: '⏳', title: `${pending.length} 个订单待阿姨确认`, desc: '请跟进确认，避免客户等待', href: 'orders.html?status=1' });
    }
    const repurchase = CustomerStorage.getRepurchaseReminders();
    if (repurchase.length) {
      alerts.push({ sev: 'info', icon: '🔔', title: `${repurchase.length} 位老客户可复购`, desc: '超过 30 天未下单，建议主动联系', href: 'customers.html?filter=repurchase' });
    }
    const onLeave = StaffStorage.getAll().filter(s => s.status === 2);
    if (onLeave.length) {
      alerts.push({ sev: 'warn', icon: '🏖️', title: `${onLeave.length} 位阿姨请假中`, desc: onLeave.map(s => s.name).join('、') + '，排班时不可派单', href: 'staff.html?status=2' });
    }
    const unpaid = SalaryStorage.getByMonth(Utils.getCurrentMonth()).filter(r => r.status === 1);
    if (unpaid.length) {
      alerts.push({ sev: 'info', icon: '💰', title: `${unpaid.length} 人本月工资待确认`, desc: '核对无误后可批量确认并导出', href: 'salary.html' });
    }

    document.getElementById('alertList').innerHTML = alerts.length === 0
      ? '<div class="no-alert">✅ 暂无待处理事项</div>'
      : alerts.map(a => `
        <div class="alert-item sev-${a.sev}" onclick="location.href='${a.href}'">
          <span class="alert-item-icon">${a.icon}</span>
          <div class="alert-item-body">
            <div class="alert-item-title">${a.title}</div>
            <div class="alert-item-desc">${a.desc}</div>
          </div>
          <span class="alert-item-go">›</span>
        </div>`).join('');

    // ===== 本周趋势 =====
    const monday = Utils.getMonday(new Date());
    const weekData = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(d.getDate() + i);
      const s = new Date(d); s.setHours(0, 0, 0, 0);
      const e = new Date(s); e.setDate(e.getDate() + 1);
      const cnt = OrderStorage.getByDateRange(s.toISOString(), e.toISOString()).filter(o => o.status !== 0).length;
      weekData.push({ label: Utils.getWeekDay(d.toISOString()), count: cnt });
    }
    const maxCnt = Math.max(...weekData.map(d => d.count), 1);
    document.getElementById('weekBars').innerHTML = weekData.map(d => `
      <div class="bar-row">
        <div class="bar-label">${d.label}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.max(d.count / maxCnt * 100, 3)}%;background:var(--primary)"></div>
        </div>
        <div class="bar-val">${d.count} 单</div>
      </div>`).join('');
  }
</script>
</body>
</html>
