<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 家政排班管理后台</title>
<link rel="stylesheet" href="styles/admin.css">
<style>
  body { overflow: hidden; }
  .auth { display: flex; height: 100vh; }

  .auth-left {
    flex: 1;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #4c1d95 100%);
    color: #fff;
    padding: 56px 60px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .auth-left::after {
    content: ''; position: absolute; right: -140px; bottom: -140px;
    width: 420px; height: 420px; border-radius: 50%;
    background: rgba(255,255,255,.05);
  }
  .auth-brand { display: flex; align-items: center; gap: 11px; font-size: 18px; font-weight: 600; }
  .auth-brand-logo {
    width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center; font-size: 21px;
  }
  .auth-pitch { position: relative; z-index: 1; }
  .auth-pitch h1 { font-size: 34px; font-weight: 700; line-height: 1.35; letter-spacing: -.5px; }
  .auth-pitch p { font-size: 15px; opacity: .72; margin-top: 14px; line-height: 1.75; max-width: 420px; }
  .auth-feats { display: flex; gap: 32px; margin-top: 34px; }
  .auth-feat-val { font-size: 25px; font-weight: 700; }
  .auth-feat-key { font-size: 12.5px; opacity: .6; margin-top: 2px; }
  .auth-copy { font-size: 12px; opacity: .4; position: relative; z-index: 1; }

  .auth-right {
    width: 480px; background: #fff; padding: 56px 56px;
    display: flex; flex-direction: column; justify-content: center;
    overflow-y: auto;
  }
  .auth-form-title { font-size: 25px; font-weight: 700; letter-spacing: -.3px; }
  .auth-form-sub { font-size: 14px; color: var(--text-tertiary); margin: 7px 0 30px; }

  .accounts { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 24px; }
  .accounts-head {
    padding: 9px 13px; background: #fafbfd; font-size: 12px;
    color: var(--text-tertiary); border-bottom: 1px solid var(--border);
  }
  .acct {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 13px; cursor: pointer; border-bottom: 1px solid var(--divider);
    transition: background .13s;
  }
  .acct:last-child { border-bottom: none; }
  .acct:hover { background: var(--primary-bg); }
  .acct-role {
    width: 30px; height: 30px; border-radius: 8px; background: var(--primary-bg);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .acct-info { flex: 1; }
  .acct-name { font-size: 13.5px; font-weight: 500; }
  .acct-phone { font-size: 12px; color: var(--text-tertiary); }
  .acct-use { font-size: 12px; color: var(--primary); }

  .app-link {
    margin-top: 22px; padding: 13px; border-radius: 10px;
    background: #f0fdf4; border: 1px solid #bbf7d0;
    display: flex; align-items: center; gap: 11px; text-align: left;
  }
  .app-link-icon { font-size: 22px; }
  .app-link-text { flex: 1; font-size: 13px; color: #15803d; }
  .app-link-text b { display: block; font-size: 13.5px; }
  .app-link a { color: #15803d; font-weight: 600; font-size: 13px; }

  @media (max-width: 940px) {
    .auth-left { display: none; }
    .auth-right { width: 100%; padding: 40px 28px; }
  }
</style>
</head>
<body>
<div class="auth">
  <div class="auth-left">
    <div class="auth-brand">
      <div class="auth-brand-logo">🏠</div>
      <span>家政排班管理系统</span>
    </div>

    <div class="auth-pitch">
      <h1>排班不撞单<br>派单不漏单<br>工资算得清</h1>
      <p>专为中小家政公司打造的轻量化调度平台。告别微信群和 Excel，让每一位阿姨都被合理安排，每一个订单都被及时响应。</p>
      <div class="auth-feats">
        <div>
          <div class="auth-feat-val">&lt;1<span style="font-size:14px">分钟</span></div>
          <div class="auth-feat-key">完成派单</div>
        </div>
        <div>
          <div class="auth-feat-val">&lt;1<span style="font-size:14px">%</span></div>
          <div class="auth-feat-key">撞单率</div>
        </div>
        <div>
          <div class="auth-feat-val">10<span style="font-size:14px">分钟</span></div>
          <div class="auth-feat-key">月底对账</div>
        </div>
      </div>
    </div>

    <div class="auth-copy">© 2026 家政排班管理系统 · MVP V0.1 演示版</div>
  </div>

  <div class="auth-right">
    <div class="auth-form-title">管理后台登录</div>
    <div class="auth-form-sub">供老板、调度员、财务使用</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label class="field-label" for="phone">手机号</label>
        <input class="input" id="phone" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="username">
      </div>
      <div class="field">
        <label class="field-label" for="password">密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:6px">登 录</button>
    </form>

    <div class="accounts">
      <div class="accounts-head">演示账号（点击自动填入）</div>
      <div id="acctList"></div>
    </div>

    <div class="app-link">
      <span class="app-link-icon">📱</span>
      <div class="app-link-text">
        <b>阿姨是在手机上用的</b>
        请打开阿姨端 APP 查看排班与接单
      </div>
      <a href="../app/index.html">前往 →</a>
    </div>
  </div>
</div>

<script src="../shared/scripts/utils.js"></script>
<script src="../shared/scripts/mock-data.js"></script>
<script src="../shared/scripts/storage.js"></script>
<script>
  initAllData();

  if (UserStorage.isLoggedIn() && UserStorage.getRole() !== 'staff') {
    location.href = 'dashboard.html';
  }

  const roleIcon = { boss: '👔', dispatcher: '🎧', finance: '🧾' };
  const roleName = { boss: '老板', dispatcher: '调度员', finance: '财务' };

  document.getElementById('acctList').innerHTML = MockData.adminUsers.map(u => `
    <div class="acct" onclick="fill('${u.phone}')">
      <div class="acct-role">${roleIcon[u.role] || '👤'}</div>
      <div class="acct-info">
        <div class="acct-name">${u.name} · ${roleName[u.role] || ''}</div>
        <div class="acct-phone">${u.phone} / 123456</div>
      </div>
      <span class="acct-use">填入</span>
    </div>
  `).join('');

  function fill(phone) {
    document.getElementById('phone').value = phone;
    document.getElementById('password').value = '123456';
    document.getElementById('password').focus();
  }

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!phone || !password) { Utils.toast('请输入手机号和密码'); return; }

    const user = MockData.adminUsers.find(u => u.phone === phone && u.password === password);
    if (!user) { Utils.toast('手机号或密码错误'); return; }

    UserStorage.save({ id: user.id, name: user.name, phone: user.phone, role: user.role });
    Utils.toast('登录成功');
    setTimeout(() => location.href = 'dashboard.html', 400);
  });
</script>
</body>
</html>
