<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#059669">
<title>订单详情 - 阿姨工作台</title>
<link rel="stylesheet" href="styles/app.css">
<style>
  .top {
    background: linear-gradient(140deg, #059669 0%, #0891b2 100%);
    color: #fff; padding: 6px 18px 48px;
  }
  .top-nav { display: flex; align-items: center; height: 46px; }
  .top-nav button { background: none; border: none; color: #fff; font-size: 27px; line-height: 1; padding: 0 10px 3px 0; cursor: pointer; }
  .top-nav span { font-size: 17px; font-weight: 600; }
  .top-st { font-size: 14px; opacity: .88; }
  .top-type { font-size: 25px; font-weight: 700; margin: 3px 0 5px; }
  .top-time { font-size: 16px; opacity: .95; }
  .top-money { font-size: 15px; opacity: .88; margin-top: 8px; }
  .top-money b { font-size: 24px; font-weight: 700; }

  .gps-box {
    display: flex; gap: 11px; padding: 13px 15px;
    background: #f0f9ff; border: 1px solid #bae6fd;
    border-radius: var(--radius); font-size: 14px; color: #075985;
    line-height: 1.6; margin-top: 12px;
  }
  .gps-ok { background: var(--brand-bg); border-color: #a7f3d0; color: #047857; }
  .gps-warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .gps-coord { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }

  .steps { display: flex; padding: 16px; }
  .step { flex: 1; text-align: center; position: relative; }
  .step::before {
    content: ''; position: absolute; top: 13px; left: 0; right: 50%;
    height: 2px; background: var(--divider);
  }
  .step::after {
    content: ''; position: absolute; top: 13px; left: 50%; right: 0;
    height: 2px; background: var(--divider);
  }
  .step:first-child::before, .step:last-child::after { display: none; }
  .step.done::before, .step.done::after { background: var(--brand); }
  .step.cur::before { background: var(--brand); }
  .step-dot {
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff; border: 2px solid var(--divider);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; margin: 0 auto 5px; position: relative; z-index: 2;
    color: var(--text-tertiary);
  }
  .step.done .step-dot { background: var(--brand); border-color: var(--brand); color: #fff; }
  .step.cur .step-dot { border-color: var(--brand); color: var(--brand); font-weight: 700; }
  .step-txt { font-size: 12.5px; color: var(--text-tertiary); }
  .step.done .step-txt, .step.cur .step-txt { color: var(--text-primary); font-weight: 500; }

  .big-call {
    display: flex; align-items: center; gap: 13px;
    padding: 15px 16px; background: var(--brand-bg);
    border-radius: var(--radius); margin-top: 4px;
  }
  .big-call-ico { font-size: 26px; }
  .big-call-b { flex: 1; }
  .big-call-t { font-size: 15px; font-weight: 600; }
  .big-call-p { font-size: 19px; font-weight: 700; color: var(--brand-dark); letter-spacing: .5px; }

  .tips { padding: 13px 15px; background: #fffbeb; border-radius: var(--radius); font-size: 14.5px; color: #92400e; line-height: 1.65; }
  .timer { text-align: center; padding: 4px 0 12px; }
  .timer-v { font-size: 32px; font-weight: 700; color: var(--brand); letter-spacing: -.5px; }
  .timer-k { font-size: 13px; color: var(--text-tertiary); }
</style>
</head>
<body>
<div class="app no-tab" id="app"></div>

<script src="../shared/scripts/utils.js"></script>
<script src="../shared/scripts/mock-data.js"></script>
<script src="../shared/scripts/storage.js"></script>
<script src="scripts/app.js"></script>
<script>
if (App.init()) {

  const id = Utils.getParam('id');
  let timerHandle = null;

  function render() {
    const o = OrderStorage.getById(id);
    if (!o) {
      document.getElementById('app').innerHTML =
        '<div class="nav"><button class="nav-back" onclick="history.back()">‹</button><span class="nav-title">订单详情</span><span class="nav-right"></span></div>' +
        '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">订单不存在</div></div>';
      return;
    }
    if (o.staffId !== App.me().id) {
      document.getElementById('app').innerHTML =
        '<div class="nav"><button class="nav-back" onclick="history.back()">‹</button><span class="nav-title">订单详情</span><span class="nav-right"></span></div>' +
        '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">这不是您的订单</div></div>';
      return;
    }

    const cust = CustomerStorage.getById(o.customerId);
    const stepIdx = o.status === 0 ? -1 : o.status === 1 ? 0 : o.status === 2 ? 1 : o.status === 3 ? 2 : 3;
    const STEPS = ['待接单', '待上门', '服务中', '已完成'];
    const mp = App.myPay(o);

    // GPS 打卡信息
    let gpsHtml = '';
    if (o.arriveAt) {
      if (o.arriveLat && o.arriveLng) {
        gpsHtml = `<div class="gps-box gps-ok">
          <span>📍</span>
          <div><b>已打卡 ${Utils.formatDate(o.arriveAt, 'HH:mm')}</b><br>
          位置已记录 <span class="gps-coord">${Number(o.arriveLat).toFixed(5)}, ${Number(o.arriveLng).toFixed(5)}</span>
          ${o.arriveAcc ? '（精度约 ' + Math.round(o.arriveAcc) + ' 米）' : ''}</div>
        </div>`;
      } else {
        gpsHtml = `<div class="gps-box gps-warn">
          <span>📍</span>
          <div><b>已打卡 ${Utils.formatDate(o.arriveAt, 'HH:mm')}</b><br>
          未能获取定位${o.arriveGpsErr ? '：' + o.arriveGpsErr : ''}，已按无位置记录</div>
        </div>`;
      }
    }

    // 服务中计时
    let timerHtml = '';
    if (o.status === 3) {
      const elapsed = Math.max(Math.floor((Date.now() - new Date(o.startTime).getTime()) / 60000), 0);
      const hh = Math.floor(elapsed / 60), mm = elapsed % 60;
      timerHtml = `<div class="card"><div class="timer">
        <div class="timer-v">${hh} 小时 ${mm} 分</div>
        <div class="timer-k">已服务时长（约定 ${o.duration} 小时）</div>
      </div></div>`;
    }

    // 操作按钮
    let actions = '';
    if (o.status === 1) {
      actions = `<button class="btn btn-grad" onclick="act(2)">✅ 确认接单</button>
                 <button class="btn btn-line" onclick="App.call('${o.customerPhone}')">📞 先联系客户</button>`;
    } else if (o.status === 2) {
      actions = `<button class="btn btn-brand" id="arriveBtn" onclick="arrive()">📍 我到了，开始服务</button>
                 <button class="btn btn-line" onclick="App.call('${o.customerPhone}')">📞 联系客户</button>`;
    } else if (o.status === 3) {
      actions = `<button class="btn btn-grad" onclick="finish()">🎉 服务完成</button>
                 <button class="btn btn-line" onclick="App.call('${o.customerPhone}')">📞 联系客户</button>`;
    } else if (o.status === 4 || o.status === 5) {
      actions = `<button class="btn btn-line" onclick="location.href='orders.html'">返回订单列表</button>`;
    } else {
      actions = `<button class="btn btn-line" onclick="location.href='orders.html'">返回订单列表</button>`;
    }

    // 提示文案
    let tip = '';
    if (o.status === 1) tip = '调度员给您派了这一单，确认后才算接下。如时间有冲突请及时联系公司。';
    else if (o.status === 2) tip = '请按约定时间上门。点「我到了」会记录打卡时间和位置，作为服务凭证，也是计时起点。';
    else if (o.status === 3) tip = '服务结束后记得点「服务完成」，这样工资才会计入本月。';

    document.getElementById('app').innerHTML = `
      <div class="top">
        <div class="top-nav">
          <button onclick="history.back()">‹</button>
          <span>订单详情</span>
        </div>
        <div class="top-st">${Utils.getOrderStatusName(o.status)}</div>
        <div class="top-type">${o.serviceType}</div>
        <div class="top-time">${Utils.formatDate(o.startTime, 'MM月DD日')} ${Utils.getWeekDay(o.startTime)}
          ${Utils.formatDate(o.startTime, 'HH:mm')}–${Utils.formatDate(o.endTime, 'HH:mm')}</div>
        <div class="top-money">${mp.perOrderBased
          ? '我这一单能拿 <b>' + Utils.formatMoney(mp.pay) + '</b>'
          : '包月固定工资，不按单计酬'}</div>
      </div>

      <div class="float">
        <div class="steps">
          ${STEPS.map((s, i) => `
            <div class="step ${i < stepIdx ? 'done' : i === stepIdx ? 'cur' : ''}">
              <div class="step-dot">${i < stepIdx ? '✓' : i + 1}</div>
              <div class="step-txt">${s}</div>
            </div>`).join('')}
        </div>
      </div>

      ${o.status === 0 ? `<div class="notice notice-warn"><span>❌</span><div>
        <b>这单已取消</b><br>${o.cancelReason || '未填写原因'}</div></div>` : ''}

      ${timerHtml}

      <div class="card">
        <div class="card-head"><span class="card-title">这一单我拿多少</span></div>
        <div class="card-body pt">
          <div class="pay-split">
            <div class="pay-split-cell mine">
              <div class="pay-split-k">我的收入</div>
              <div class="pay-split-v">${mp.perOrderBased ? Utils.formatMoney(mp.pay) : '—'}</div>
              <div class="pay-split-note">${mp.note}</div>
            </div>
            <div class="pay-split-cell other">
              <div class="pay-split-k">客户付款</div>
              <div class="pay-split-v">${Utils.formatMoney(o.amount)}</div>
              <div class="pay-split-note">这是客户付给公司的钱，不是您的收入</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">客户与地址</span></div>
        <div class="card-body">
          <div class="big-call" onclick="App.call('${o.customerPhone}')">
            <span class="big-call-ico">📞</span>
            <div class="big-call-b">
              <div class="big-call-t">${o.customerName}</div>
              <div class="big-call-p">${o.customerPhone}</div>
            </div>
            <span style="font-size:14px;color:var(--brand);font-weight:600">拨打</span>
          </div>

          <div class="info-row" style="border-top:1px solid var(--divider);margin-top:14px">
            <span class="info-k">地址</span>
            <span class="info-v">${o.address}</span>
          </div>
          <div class="info-row">
            <span class="info-k">服务时长</span>
            <span class="info-v">${o.duration} 小时</span>
          </div>
          ${o.remark ? `<div class="info-row">
            <span class="info-k">客户要求</span>
            <span class="info-v" style="color:#b45309">${o.remark}</span>
          </div>` : ''}
          ${cust && cust.tags && cust.tags.length ? `<div class="info-row">
            <span class="info-k">注意事项</span>
            <span class="info-v">${cust.tags.map(t => `<span class="tag tag-soft">${t}</span>`).join(' ')}</span>
          </div>` : ''}
          ${cust && cust.remark ? `<div class="info-row">
            <span class="info-k">客户备注</span>
            <span class="info-v" style="font-weight:400">${cust.remark}</span>
          </div>` : ''}
          ${gpsHtml}
        </div>
      </div>

      ${tip ? `<div class="notice notice-info"><span>💡</span><div>${tip}</div></div>` : ''}

      <div style="height:${o.status === 0 || o.status >= 4 ? '80' : '140'}px"></div>

      <div class="action-fix">${actions}</div>`;

    // 服务中每分钟刷新计时
    if (timerHandle) clearInterval(timerHandle);
    if (o.status === 3) timerHandle = setInterval(render, 60000);
  }

  window.act = function (status) {
    OrderStorage.update(id, { status });
    Utils.toast('已确认接单！');
    render();

    // 通知调度员（示意）
    const o = OrderStorage.getById(id);
    NotifyStorage.push('order_confirmed', '调度员', '',
      `${o.staffName} 已确认接单：${Utils.formatDate(o.startTime, 'MM-DD HH:mm')} ${o.customerName}（${o.serviceType}）`, id);
  };

  /** 上门打卡：先尝试取 GPS，无论成功失败都不阻塞打卡 */
  window.arrive = function () {
    const btn = document.getElementById('arriveBtn');
    if (btn) { btn.disabled = true; btn.textContent = '正在定位…'; }

    function finish(extra) {
      OrderStorage.update(id, Object.assign({
        status: 3,
        arriveAt: new Date().toISOString()
      }, extra));
      Utils.toast('已打卡，开始计时');
      render();
    }

    if (!navigator.geolocation) {
      finish({ arriveGpsErr: '设备不支持定位' });
      return;
    }

    // HTTPS 或 localhost 才允许定位
    const secure = location.protocol === 'https:' ||
      location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!secure) {
      finish({ arriveGpsErr: '非 HTTPS 环境浏览器禁止定位' });
      return;
    }

    let done = false;
    const timer = setTimeout(function () {
      if (!done) { done = true; finish({ arriveGpsErr: '定位超时' }); }
    }, 8000);

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        if (done) return;
        done = true; clearTimeout(timer);
        finish({
          arriveLat: pos.coords.latitude,
          arriveLng: pos.coords.longitude,
          arriveAcc: pos.coords.accuracy
        });
      },
      function (err) {
        if (done) return;
        done = true; clearTimeout(timer);
        const msgs = { 1: '您拒绝了定位授权', 2: '无法获取位置', 3: '定位超时' };
        finish({ arriveGpsErr: msgs[err.code] || '定位失败' });
      },
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 30000 }
    );
  };

  window.finish = function () {
    if (!confirm('确认这一单已经做完了吗？')) return;
    OrderStorage.update(id, {
      status: 4,
      finishAt: new Date().toISOString(),
      reviewInvitedAt: new Date().toISOString()
    });

    // 自动向客户发送评价邀请（示意：真实发送需后端对接短信服务商）
    const o = OrderStorage.getById(id);
    const link = location.origin + location.pathname.replace(/app\/order-detail\.html$/, 'review.html') + '?order=' + id;
    NotifyStorage.push('review_invite', o.customerName, o.customerPhone,
      `【家政管家】您的${o.serviceType}服务已完成，感谢信任！请为${o.staffName}的服务打个分：${link}`, id);

    const mp = App.myPay(o);
    Utils.toast(mp.perOrderBased
      ? '🎉 辛苦啦！本单收入 ' + Utils.formatMoney(mp.pay) + ' 已计入本月'
      : '🎉 辛苦啦！服务已完成');
    render();
  };

  render();
}
</script>
</body>
</html>
