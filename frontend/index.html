<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家政排班与订单管理系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(150deg, #0f172a 0%, #1e293b 55%, #312e81 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
    color: #fff;
  }
  .wrap { max-width: 760px; width: 100%; text-align: center; }
  .logo { font-size: 56px; }
  h1 { font-size: 29px; font-weight: 700; margin: 12px 0 8px; letter-spacing: -.4px; }
  .sub { font-size: 15px; opacity: .65; margin-bottom: 40px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    display: block; text-align: left; text-decoration: none; color: #fff;
    padding: 26px 24px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,.12);
    transition: transform .18s, box-shadow .18s;
    position: relative; overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.3); }
  .card-admin { background: linear-gradient(140deg, #1e40af 0%, #4c1d95 100%); }
  .card-app { background: linear-gradient(140deg, #059669 0%, #0891b2 100%); }
  .card-ico { font-size: 38px; }
  .card-t { font-size: 20px; font-weight: 700; margin: 10px 0 5px; }
  .card-d { font-size: 13.5px; opacity: .82; line-height: 1.65; }
  .card-dev {
    display: inline-block; margin-top: 14px; padding: 4px 12px;
    background: rgba(255,255,255,.18); border-radius: 14px; font-size: 12px;
  }
  .card-go { margin-top: 16px; font-size: 14px; font-weight: 600; }

  .feats {
    display: flex; gap: 26px; justify-content: center; flex-wrap: wrap;
    margin-top: 40px; padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,.1);
  }
  .feat { font-size: 12.5px; opacity: .6; }
  .feat-ico { font-size: 21px; display: block; margin-bottom: 4px; }
  .foot { margin-top: 30px; font-size: 12px; opacity: .35; line-height: 1.8; }

  @media (max-width: 620px) {
    .cards { grid-template-columns: 1fr; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🏠</div>
  <h1>家政排班与订单管理系统</h1>
  <div class="sub">排班不撞单 · 派单不漏单 · 工资算得清</div>

  <div class="cards">
    <a class="card card-admin" href="admin/index.html">
      <div class="card-ico">💼</div>
      <div class="card-t">管理后台</div>
      <div class="card-d">老板 / 调度员 / 财务<br>排班日历、智能派单、工资结算、经营看板</div>
      <div class="card-dev">🖥 电脑端使用</div>
      <div class="card-go">进入后台 →</div>
    </a>

    <a class="card card-app" href="app/index.html">
      <div class="card-ico">📱</div>
      <div class="card-t">阿姨端 APP</div>
      <div class="card-d">服务人员使用<br>查排班、接订单、上门打卡、看工资明细</div>
      <div class="card-dev">📱 手机端使用</div>
      <div class="card-go">打开 APP →</div>
    </a>
  </div>

  <div class="feats">
    <div class="feat"><span class="feat-ico">📅</span>可视化排班</div>
    <div class="feat"><span class="feat-ico">⚡</span>智能派单</div>
    <div class="feat"><span class="feat-ico">🔍</span>冲突检测</div>
    <div class="feat"><span class="feat-ico">💰</span>自动算工资</div>
    <div class="feat"><span class="feat-ico">📊</span>经营分析</div>
  </div>

  <div class="foot">
    MVP V0.1 演示版 · 数据保存在浏览器本地<br>
    管理后台 13800001111 / 123456 &nbsp;·&nbsp; 阿姨端 13900001111 / 123456
  </div>
</div>
</body>
</html>
