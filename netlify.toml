# Netlify 部署配置
# 纯静态站点，只发布 frontend 目录，无需构建步骤

[build]
  publish = "frontend"
  command = ""

[build.environment]
  NODE_VERSION = "22"

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 静态资源缓存
[[headers]]
  for = "/shared/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
